
name: AI Eco Campus Tycoon 3D Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract game ZIP
        run: |
          unzip -o AI_Eco_Campus_Tycoon3D_JUnit_Fixed_v2.zip -d game
          echo "Extracted project:"
          find game -maxdepth 3 -type f | head -100

      - name: Locate Android project
        run: |
          PROJECT_DIR=$(find game -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Gradle settings file not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project found: $PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        run: |
          cd "$PROJECT_DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon :android:assembleDebug
          else
            gradle --no-daemon :android:assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Eco-Campus-Tycoon3D-APK
          path: |
            game/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
