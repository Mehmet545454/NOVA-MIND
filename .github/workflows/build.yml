
name: android-build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: ZIP dosyalarını aç ve proje kökünü bul
        shell: bash
        run: |
          set -e
          mkdir -p work
          shopt -s nullglob
          zips=(incoming/*.zip)

          if (( ${#zips[@]} )); then
            for z in "${zips[@]}"; do
              echo "Açılıyor: $z"
              unzip -t "$z"
              unzip -o -q "$z" -d work
            done
          else
            echo "incoming/ altında ZIP yok."
            rsync -a --exclude work --exclude .git ./ work/
          fi

          S=$(find work -maxdepth 6 -name settings.gradle -print -quit)

          if [ -z "$S" ]; then
            echo "HATA: settings.gradle bulunamadı."
            find work -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$S")

          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/android/build.gradle"
          test -f "$PROJECT_DIR/android/src/main/AndroidManifest.xml"

          echo "WORK=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "HATA: sdkmanager bulunamadı."
            find "$ANDROID_HOME" -name sdkmanager -type f
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Başlangıç modellerini doğrula
        working-directory: ${{ env.WORK }}
        run: python3 tools/validate_runtime_assets.py

      - name: Nature modellerini doğrula
        working-directory: ${{ env.WORK }}
        run: python3 tools/validate_nature_assets.py

      - name: Oyun verilerini doğrula
        working-directory: ${{ env.WORK }}
        run: python3 tools/validate_data.py

      - name: Simülasyon testleri
        working-directory: ${{ env.WORK }}
        run: gradle --no-daemon :sim:test

      - name: Android APK derle
        working-directory: ${{ env.WORK }}
        run: gradle --no-daemon clean :android:assembleDebug

      - name: APK doğrula
        shell: bash
        run: |
          set -e

          APK=$(find "$WORK" \
            -path '*outputs/apk/debug/*.apk' \
            -type f | head -1)

          if [ -z "$APK" ]; then
            echo "HATA: APK bulunamadı."
            exit 1
          fi

          mkdir -p out
          cp "$APK" "out/AI_Eco_Campus_Tycoon3D.apk"

          ls -lh out/

      - name: APK artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: AI-Eco-Campus-Tycoon3D-APK
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: GitHub Release oluştur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AI Eco Campus Tycoon 3D - Build ${{ github.run_number }}
          prerelease: true
          files: out/*.apk
