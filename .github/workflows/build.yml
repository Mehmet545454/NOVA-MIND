
name: AI Eco Campus Tycoon 3D Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager bulunamadi!"
            exit 1
          fi

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify ZIP
        run: |
          ZIP="AI_Eco_Campus_Tycoon3D_Crash_Diagnostics.zip"

          if [ ! -f "$ZIP" ]; then
            echo "Oyun ZIP dosyasi bulunamadi!"
            find . -maxdepth 3 -type f -iname '*.zip'
            exit 1
          fi

          unzip -t "$ZIP"

      - name: Extract project
        run: |
          mkdir -p game
          unzip -o AI_Eco_Campus_Tycoon3D_Crash_Diagnostics.zip -d game

          test -f game/settings.gradle
          test -f game/build.gradle
          test -f game/android/build.gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Android APK
        working-directory: game
        run: |
          gradle --no-daemon clean :android:assembleDebug

      - name: Verify APK
        run: |
          APK=$(find game/android/build/outputs/apk/debug \
            -type f -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK olusturulamadi!"
            exit 1
          fi

          mkdir -p output
          cp "$APK" output/AI_Eco_Campus_Tycoon3D.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Eco-Campus-Tycoon3D-APK
          path: output/AI_Eco_Campus_Tycoon3D.apk
          if-no-files-found: error
          retention-days: 14
