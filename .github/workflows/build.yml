
name: AI Eco Campus Tycoon 3D Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -e

          mkdir -p work

          ZIP="AI_Eco_Campus_Tycoon3D_EARLIEST_DIAGNOSTICS.zip"

          if [ -f "$ZIP" ]; then
            echo "Proje ZIP dosyası bulundu."
            unzip -t "$ZIP"
            unzip -o "$ZIP" -d work

          elif [ -f "incoming/$ZIP" ]; then
            echo "Incoming klasöründe ZIP bulundu."
            unzip -t "incoming/$ZIP"
            unzip -o "incoming/$ZIP" -d work

          elif [ -f "settings.gradle" ]; then
            echo "Depoda doğrudan proje kaynakları bulundu."
            rsync -a --exclude='.git' ./ work/

          else
            echo "HATA: Proje ZIP veya kaynak dosyaları bulunamadı."
            find . -maxdepth 3 -type f
            exit 1
          fi

          SETTINGS=$(find work -maxdepth 6 \
            -type f -name settings.gradle -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "HATA: settings.gradle bulunamadı."
            find work -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/android/build.gradle"
          test -f "$PROJECT_DIR/android/src/main/AndroidManifest.xml"

          echo "WORK=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "HATA: sdkmanager bulunamadı."
            find "$ANDROID_HOME" -name sdkmanager -type f
            exit 1
          fi

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK components
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Validate runtime models
        working-directory: ${{ env.WORK }}
        run: python3 tools/validate_runtime_assets.py

      - name: Validate nature assets
        working-directory: ${{ env.WORK }}
        run: python3 tools/validate_nature_assets.py

      - name: Validate game data
        working-directory: ${{ env.WORK }}
        run: python3 tools/validate_data.py

      - name: Run simulation tests
        working-directory: ${{ env.WORK }}
        run: gradle --no-daemon :sim:test

      - name: Build Debug APK
        working-directory: ${{ env.WORK }}
        run: gradle --no-daemon clean :android:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK=$(find "$WORK/android/build/outputs/apk/debug" \
            -type f -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "HATA: APK oluşturulamadı."
            exit 1
          fi

          mkdir -p output
          cp "$APK" output/AI_Eco_Campus_Tycoon3D.apk

          ls -lh output/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Eco-Campus-Tycoon3D-APK
          path: output/AI_Eco_Campus_Tycoon3D.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AI Eco Campus Tycoon 3D - Build ${{ github.run_number }}
          prerelease: true
          files: output/AI_Eco_Campus_Tycoon3D.apk
