
name: AI Eco Campus Tycoon 3D Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -e

          ZIP="AI_Eco_Campus_Tycoon3D_STARTUP_TRACE_DIAGNOSTICS.zip"

          mkdir -p work

          if [ -f "$ZIP" ]; then
            echo "ZIP ana dizinde bulundu: $ZIP"

          elif [ -f "incoming/$ZIP" ]; then
            ZIP="incoming/$ZIP"
            echo "ZIP incoming klasöründe bulundu."

          else
            echo "HATA: Proje ZIP bulunamadı."
            find . -maxdepth 3 -type f -iname '*.zip'
            exit 1
          fi

          echo "ZIP kontrol ediliyor..."
          unzip -t "$ZIP"

          echo "Proje açılıyor..."
          unzip -o -q "$ZIP" -d work

          echo "Gradle proje dosyası aranıyor..."

          SETTINGS=$(find work -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "HATA: settings.gradle bulunamadı."
            find work -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          test -f "$PROJECT_DIR/build.gradle" -o \
               -f "$PROJECT_DIR/build.gradle.kts"

          test -f "$PROJECT_DIR/android/build.gradle" -o \
               -f "$PROJECT_DIR/android/build.gradle.kts"

          echo "WORK=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Proje kökü: $PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "HATA: sdkmanager bulunamadı."
            exit 1
          fi

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Validate runtime assets
        working-directory: ${{ env.WORK }}
        run: |
          if [ -f tools/validate_runtime_assets.py ]; then
            python3 tools/validate_runtime_assets.py
          else
            echo "Runtime validator bulunamadı, atlanıyor."
          fi

      - name: Validate nature assets
        working-directory: ${{ env.WORK }}
        run: |
          if [ -f tools/validate_nature_assets.py ]; then
            python3 tools/validate_nature_assets.py
          else
            echo "Nature validator bulunamadı, atlanıyor."
          fi

      - name: Validate game data
        working-directory: ${{ env.WORK }}
        run: |
          if [ -f tools/validate_data.py ]; then
            python3 tools/validate_data.py
          else
            echo "Data validator bulunamadı, atlanıyor."
          fi

      - name: Run simulation tests
        working-directory: ${{ env.WORK }}
        run: gradle --no-daemon :sim:test

      - name: Build Android APK
        working-directory: ${{ env.WORK }}
        run: gradle --no-daemon clean :android:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK=$(find "$WORK/android/build/outputs/apk/debug" \
            -type f -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "HATA: APK oluşturulamadı."
            exit 1
          fi

          mkdir -p output
          cp "$APK" output/AI_Eco_Campus_Tycoon3D.apk

          ls -lh output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Eco-Campus-Tycoon3D-APK
          path: output/AI_Eco_Campus_Tycoon3D.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AI Eco Campus Tycoon 3D Build ${{ github.run_number }}
          prerelease: true
          files: output/AI_Eco_Campus_Tycoon3D.apk
