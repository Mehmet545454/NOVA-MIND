
name: AI Eco Campus Tycoon 3D Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract game project
        run: |
          unzip -o AI_Eco_Campus_Tycoon3D_25MB.zip -d .
          test -f settings.gradle
          test -f android/build.gradle
          echo "Game project extracted successfully"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate project data
        run: |
          python3 tools/validate_data.py
          python3 tools/validate_assets.py
          python3 tools/validate_runtime_assets.py
          python3 tools/validate_nature_assets.py

      - name: Run simulation tests
        run: gradle --no-daemon :sim:test

      - name: Build Android APK
        run: gradle --no-daemon :android:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Eco-Campus-Tycoon3D-APK
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AI Eco Campus Tycoon 3D Build ${{ github.run_number }}
          prerelease: true
          files: android/build/outputs/apk/debug/*.apk
          
