
name: AI Eco Campus Tycoon 3D Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false

      - name: Accept Android licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail

      - name: Install SDK 36
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Extract Crash Diagnostics ZIP
        run: |
          ZIP="AI_Eco_Campus_Tycoon3D_Crash_Diagnostics.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ZIP bulunamadi: $ZIP"
            find . -maxdepth 3 -type f -iname '*.zip'
            exit 1
          fi

          unzip -t "$ZIP"
          mkdir -p game
          unzip -o "$ZIP" -d game

          test -f game/settings.gradle
          test -f game/build.gradle
          test -f game/android/build.gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: game
        run: |
          gradle --no-daemon clean :android:assembleDebug

      - name: Verify APK
        run: |
          APK=$(find game/android/build/outputs/apk/debug \
            -type f -name '*.apk' | head -n 1)

          test -n "$APK"
          mkdir -p output
          cp "$APK" output/AI_Eco_Campus_Tycoon3D.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Eco-Campus-Tycoon3D-APK
          path: output/AI_Eco_Campus_Tycoon3D.apk
          if-no-files-found: error
          retention-days: 14
