
name: NOVA MIND - Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-mind-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build and verify Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          sdkmanager --licenses </dev/null

      - name: Install Android SDK packages
        shell: bash
        run: |
          # Required SDK versions: android-37 build-tools;36.0.0
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;36.0.0"

      - name: Configure Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-provider: basic

      - name: Validate project structure
        run: bash scripts/check-project.sh

      - name: Show toolchain
        run: |
          java -version
          gradle --version

      - name: Compile debug APK including native libraries
        run: gradle --no-daemon --stacktrace :android:assembleDebug

      - name: Verify APK package
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find android/build/outputs/apk/debug \
            -maxdepth 1 -type f -name '*.apk' -print -quit)"

          test -n "$APK"
          test -s "$APK"

          echo "APK file: $APK"
          ls -lh "$APK"

          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" \
            dump badging "$APK")"

          printf '%s\n' "$BADGING" | sed -n '1,8p'

          printf '%s\n' "$BADGING" | grep -Fq \
            "package: name='com.novamind.game.debug'"

          printf '%s\n' "$BADGING" | grep -Fq "sdkVersion:'23'"
          printf '%s\n' "$BADGING" | grep -Fq "targetSdkVersion:'36'"

          APK_CONTENTS="$(unzip -Z1 "$APK")"

          # Each native library must be present as lib/$ABI/libgdx.so.
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            printf '%s\n' "$APK_CONTENTS" | \
              grep -Fq "lib/$ABI/libgdx.so"
          done

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v7
        with:
          name: NOVA-MIND-Android-APK
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: success()
        run: |
          echo '## NOVA MIND APK is ready' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download **NOVA-MIND-Android-APK** from the Artifacts section.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Version: 1.4.0 | Compile SDK: 37 | Target SDK: 36 | Min Android: 6.0 (API 23).' >> "$GITHUB_STEP_SUMMARY"
          
