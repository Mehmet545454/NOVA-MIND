
name: NOVA MIND Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-apk.yml"
      - "NOVA_MIND_ANDROID_COMPLETE_V1_5_CRASH_REPORT.zip"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK kur
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Android SDK paketlerini kur
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          sdkmanager --licenses </dev/null || true

      - name: Projeyi ZIP dosyasından çıkar
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/NOVA_MIND_ANDROID_COMPLETE_V1_5_CRASH_REPORT.zip"

          if [ ! -s "$ZIP" ]; then
            echo "HATA: NOVA MIND V1.5 ZIP bulunamadı!"
            ls -lah "$GITHUB_WORKSPACE"
            exit 1
          fi

          echo "Kullanılan ZIP: $ZIP"
          unzip -tq "$ZIP"

          DEST="$RUNNER_TEMP/nova-mind-source"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          unzip -oq "$ZIP" -d "$DEST"

          PROJECT=""
          ANDROID_FILE=""

          while IFS= read -r -d '' SETTINGS; do
            DIR="$(dirname "$SETTINGS")"

            for FILE in \
              "$DIR/android/build.gradle" \
              "$DIR/android/build.gradle.kts"; do

              if [ -f "$FILE" ] && \
                { [ -f "$DIR/core/build.gradle" ] || \
                  [ -f "$DIR/core/build.gradle.kts" ]; }; then
                PROJECT="$DIR"
                ANDROID_FILE="$FILE"
                break 2
              fi
            done
          done < <(
            find "$DEST" -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print0
          )

          if [ -z "$PROJECT" ]; then
            echo "Gradle projesi bulunamadı."
            find "$DEST" -maxdepth 7 -type f
            exit 1
          fi

          echo "Proje: $PROJECT"
          echo "Android build: $ANDROID_FILE"

          sed -i \
            -e 's/compileSdk 37/compileSdk 36/g' \
            -e 's/compileSdk = 37/compileSdk = 36/g' \
            -e 's/compileSdkVersion 37/compileSdkVersion 36/g' \
            "$ANDROID_FILE"

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Gradle uyumluluk ayarları
        shell: bash
        run: |
          set -euo pipefail

          FILE="$PROJECT_DIR/gradle.properties"
          touch "$FILE"

          if grep -q '^android.sourceset.disallowProvider=' "$FILE"; then
            sed -i \
              's/^android.sourceset.disallowProvider=.*/android.sourceset.disallowProvider=false/' \
              "$FILE"
          else
            echo 'android.sourceset.disallowProvider=false' >> "$FILE"
          fi

          cat "$FILE"

      - name: Proje dosyalarını kontrol et
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT_DIR/settings.gradle" || test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/android/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/core/src/main/java/com/novamind/game/NovaMindGame.java"
          echo "Proje dosyaları bulundu."

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Android APK oluştur
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :android:assembleDebug

      - name: APK kontrol et
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/android/build/outputs/apk/debug" \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "APK oluşturulamadı."
            find "$PROJECT_DIR" -type f -name '*.apk'
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/NOVA-MIND-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/dist/NOVA-MIND-debug.apk"

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-MIND-Android-APK
          path: dist/NOVA-MIND-debug.apk
          if-no-files-found: error
          retention-days: 14
          
