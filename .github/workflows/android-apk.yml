
name: NOVA MIND - Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-mind-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NOVA MIND 1.4.0
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --licenses </dev/null

      - name: Install Android SDK 36
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Adjust project SDK
        shell: bash
        run: |
          sed -i 's/compileSdk 37/compileSdk 36/g' android/build.gradle

          sed -i \
            -e 's/compileSdk 37/compileSdk 36/g' \
            -e 's/android-37/android-36/g' \
            scripts/check-project.sh

      - name: Validate project
        run: bash scripts/check-project.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-provider: basic

      - name: Build Android APK
        run: |
          gradle --no-daemon --stacktrace :android:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find android/build/outputs/apk/debug \
            -maxdepth 1 -name '*.apk' -type f -print -quit)

          test -n "$APK"
          test -s "$APK"

          echo "APK found: $APK"
          ls -lh "$APK"

          BADGING=$("$ANDROID_HOME/build-tools/36.0.0/aapt" \
            dump badging "$APK")

          echo "$BADGING" | head -n 8

          echo "$BADGING" | grep -Fq \
            "package: name='com.novamind.game.debug'"

          echo "$BADGING" | grep -Fq "sdkVersion:'23'"
          echo "$BADGING" | grep -Fq "targetSdkVersion:'36'"

          CONTENTS=$(unzip -Z1 "$APK")

          for ABI in arm64-v8a armeabi-v7a x86_64; do
            echo "$CONTENTS" | grep -Fq "lib/$ABI/libgdx.so"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-MIND-Android-APK
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: success()
        run: |
          echo "## NOVA MIND APK hazır!" >> "$GITHUB_STEP_SUMMARY"
          echo "Version: 1.4.0" >> "$GITHUB_STEP_SUMMARY"
          echo "Android SDK: 36" >> "$GITHUB_STEP_SUMMARY"
          echo "Target SDK: 36" >> "$GITHUB_STEP_SUMMARY"
          echo "APK başarıyla oluşturuldu." >> "$GITHUB_STEP_SUMMARY"
          
