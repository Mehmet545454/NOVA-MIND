
name: NOVA MIND - Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK setup
        uses: android-actions/setup-android@v4

      - name: Accept SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses

      - name: Install SDK
        run: |
          # Required packages: android-37 build-tools;36.0.0
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;36.0.0"

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-provider: basic

      - name: Validate project
        run: bash scripts/check-project.sh

      - name: Build APK
        run: |
          gradle --no-daemon --stacktrace :android:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find android/build/outputs/apk/debug \
            -name '*.apk' -type f | head -n 1)

          test -n "$APK"
          test -s "$APK"

          echo "APK: $APK"
          ls -lh "$APK"

          BADGING=$("$ANDROID_HOME/build-tools/36.0.0/aapt" \
            dump badging "$APK")

          echo "$BADGING" | head -n 8

          echo "$BADGING" | grep -Fq \
            "package: name='com.novamind.game.debug'"

          echo "$BADGING" | grep -Fq "sdkVersion:'23'"
          echo "$BADGING" | grep -Fq "targetSdkVersion:'36'"

          APK_CONTENTS=$(unzip -Z1 "$APK")

          for ABI in arm64-v8a armeabi-v7a x86_64; do
            echo "$APK_CONTENTS" | grep -Fq "lib/$ABI/libgdx.so"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: NOVA-MIND-Android-APK
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
          
