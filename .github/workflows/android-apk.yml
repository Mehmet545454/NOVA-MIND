
name: NOVA MIND Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-mind-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept ALL Android licenses
        shell: bash
        run: |
          set -o pipefail
          yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Check project
        run: bash scripts/check-project.sh

      - name: Build NOVA MIND APK
        run: |
          gradle --no-daemon --stacktrace :android:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e
          APK=$(find android/build/outputs/apk/debug \
            -name '*.apk' -type f | head -n 1)

          test -n "$APK"
          test -s "$APK"

          echo "APK hazır:"
          ls -lh "$APK"

          "$ANDROID_HOME/build-tools/36.0.0/aapt" \
            dump badging "$APK" | head -n 8

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-MIND-APK
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
          
