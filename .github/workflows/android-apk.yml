
name: NOVA MIND - Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-mind-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: NOVA MIND 1.4.0 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Extract and locate project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/NOVA_MIND_ANDROID_COMPLETE_V1_4.zip"
          DEST="$RUNNER_TEMP/nova-mind-source"

          test -s "$ZIP"
          unzip -tq "$ZIP"

          rm -rf "$DEST"
          mkdir -p "$DEST"
          unzip -oq "$ZIP" -d "$DEST"

          PROJECT=""
          ANDROID_FILE=""

          while IFS= read -r -d '' SETTINGS; do
            DIR="$(dirname "$SETTINGS")"

            for FILE in \
              "$DIR/android/build.gradle" \
              "$DIR/android/build.gradle.kts"; do

              if [ -f "$FILE" ] && \
                 { [ -f "$DIR/core/build.gradle" ] || \
                   [ -f "$DIR/core/build.gradle.kts" ]; }; then
                PROJECT="$DIR"
                ANDROID_FILE="$FILE"
                break 2
              fi
            done
          done < <(
            find "$DEST" -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print0
          )

          if [ -z "$PROJECT" ]; then
            echo "Gradle projesi bulunamadı."
            find "$DEST" -maxdepth 6 -type f
            exit 1
          fi

          echo "Proje: $PROJECT"
          echo "Android build: $ANDROID_FILE"

          sed -i \
            -e 's/compileSdk 37/compileSdk 36/g' \
            -e 's/compileSdk = 37/compileSdk = 36/g' \
            -e 's/compileSdkVersion 37/compileSdkVersion 36/g' \
            "$ANDROID_FILE"

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Fix Android SourceSet compatibility
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          touch gradle.properties

          if ! grep -q '^android.sourceset.disallowProvider=' gradle.properties; then
            echo 'android.sourceset.disallowProvider=false' >> gradle.properties
          else
            sed -i \
              's/^android.sourceset.disallowProvider=.*/android.sourceset.disallowProvider=false/' \
              gradle.properties
          fi

          echo "Gradle uyumluluk ayarı:"
          cat gradle.properties

          echo "Native kütüphane görevleri:"
          grep -nE 'copyAndroidNatives|preBuild|jniLibs|srcDirs' \
            android/build.gradle || true

      - name: Validate project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts
          test -f android/build.gradle || test -f android/build.gradle.kts
          test -f core/build.gradle || test -f core/build.gradle.kts

          test -s android/src/main/AndroidManifest.xml
          test -s core/src/main/java/com/novamind/game/NovaMindGame.java
          test -s android/src/main/java/com/novamind/game/android/AndroidLauncher.java

          echo "Kaynak dosyalar doğrulandı."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle --no-daemon \
            --stacktrace \
            :android:assembleDebug

      - name: Find and verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/android/build/outputs/apk" \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "APK oluşturulamadı."
            find "$PROJECT_DIR/android/build/outputs" \
              -type f 2>/dev/null || true
            exit 1
          fi

          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          BADGING="$("$AAPT" dump badging "$APK")"

          echo "$BADGING" | head -n 15

          echo "$BADGING" | grep -Fq \
            "package: name='com.novamind.game.debug'"

          echo "$BADGING" | grep -Fq "sdkVersion:'23'"
          echo "$BADGING" | grep -Fq "targetSdkVersion:'36'"

          CONTENTS="$(unzip -Z1 "$APK")"

          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
            echo "$CONTENTS" | grep -Fq "lib/$ABI/libgdx.so"
          done

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/NOVA-MIND-1.4.0-debug.apk"

          echo "APK doğrulandı."
          ls -lh "$GITHUB_WORKSPACE/dist/"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-MIND-ANDROID-APK
          path: dist/NOVA-MIND-1.4.0-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: success()
        run: |
          {
            echo "## NOVA MIND APK HAZIR"
            echo "Derleme başarılı."
            echo "Android SDK: 36"
            echo "Target SDK: 36"
            echo "APK doğrulandı."
          } >> "$GITHUB_STEP_SUMMARY"
          
